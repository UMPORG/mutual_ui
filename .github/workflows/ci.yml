name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Tipos, testes e build do showcase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Lisbon

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            showcase/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Instalar (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Tipos (bun check, pacote e ficheiro solto)
        run: pnpm typecheck

      - name: Testes (vp test run)
        run: pnpm test

      - name: Auditoria de dependências (qualquer nível)
        run: pnpm audit

      - name: Build do showcase
        working-directory: showcase
        run: |
          # O watcher do Tailwind (@parcel/watcher) não precisa do seu script de build no build do showcase.
          pnpm install --frozen-lockfile --ignore-workspace --config.strict-dep-builds=false
          pnpm build

  segredos:
    name: Segredos (gitleaks, só aviso)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (SHA256 verificado)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          ficheiro="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "${base}/${ficheiro}"
          curl -fsSL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ficheiro}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ficheiro}" gitleaks

      - name: Procurar segredos no intervalo enviado
        env:
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          inicio="${BASE_PR:-$ANTES}"
          if [ -z "$inicio" ] || [ "$inicio" = "0000000000000000000000000000000000000000" ]; then
            intervalo="$DEPOIS"
          else
            intervalo="${inicio}..${DEPOIS}"
          fi
          ./gitleaks git --redact --exit-code 0 --log-opts="$intervalo" .
